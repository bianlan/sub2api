# Sub2API 本地构建部署配置
# PostgreSQL 和 Redis 使用独立容器运行，本文件只启动 Sub2API。
# 三个容器通过外部网络 sub2api-net 通信，不暴露数据库端口到宿主机。
services:
  sub2api:
    # 使用项目根目录 Dockerfile 构建本地镜像，修改源码后执行 --build 即可更新。
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2api:260907
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      # 宿主机端口取 .env 的 SERVER_PORT，容器端口固定 8080，必须与下面 environment 的 SERVER_PORT 一致。
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-80}:8080"
    volumes:
      - sub2api_data:/app/data
    # 加入外部网络，与 PostgreSQL、Redis 容器直接通过容器名通信。
    networks:
      - sub2api-net
    env_file:
      - .env
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      # 容器内程序监听端口，必须与 ports 的容器端口、healthcheck 端口三者一致。
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - RUN_MODE=${RUN_MODE:-standard}
      - DATABASE_HOST=${DATABASE_HOST:?DATABASE_HOST is required}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-sub2api}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - DATABASE_DBNAME=${DATABASE_DBNAME:-sub2api}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE:-disable}
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  sub2api_data:
    driver: local

networks:
  sub2api-net:
    # 使用外部已创建的网络，PostgreSQL 和 Redis 也加入此网络。
    external: true
    name: sub2api-net
